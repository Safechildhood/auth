version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: auth-app:latest
    container_name: auth-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - APP_PRODUCTION=${APP_PRODUCTION}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${SERVER_PORT}
      # Database
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      # Temporary Database (Valkey)
      - TEMPORARY_DATABASE_HOST=valkey
      - TEMPORARY_DATABASE_PORT=6379
      - TEMPORARY_DATABASE_PASSWORD=${TEMPORARY_DATABASE_PASSWORD}
      # Broker (RabbitMQ)
      - BROKER_HOST=rabbitmq
      - BROKER_PORT=${BROKER_PORT}
      - BROKER_USER=${BROKER_USER}
      - BROKER_PASSWORD=${BROKER_PASSWORD}
      - BROKER_VHOST=${BROKER_VHOST}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - auth-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${SERVER_PORT}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:18-alpine
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  valkey:
    image: valkey/valkey:9.0.0-alpine
    container_name: valkey-auth
    restart: unless-stopped
    command: >
      --requirepass ${TEMPORARY_DATABASE_PASSWORD}
      --appendonly yes
    ports:
      - "${TEMPORARY_DATABASE_PORT}:6379"
    volumes:
      - valkey_data:/data
    networks:
      - auth-network
    healthcheck:
      test:
        [
          "CMD",
          "valkey-cli",
          "--pass",
          "${TEMPORARY_DATABASE_PASSWORD}",
          "ping",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  rabbitmq:
    image: rabbitmq:4.2-alpine
    container_name: rabbitmq-auth
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${BROKER_USER}
      - RABBITMQ_DEFAULT_PASS=${BROKER_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=${BROKER_VHOST}
    ports:
      - "${BROKER_PORT}:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - auth-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3

  # grpcui:
  #   image: fullstorydev/grpcui:latest
  #   command: -plaintext app:${SERVER_PORT}
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - app
  #   networks:
  #     - auth-network

volumes:
  postgres_data:
  valkey_data:
  rabbitmq_data:
  app_data:

networks:
  auth-network:
    driver: bridge
